site_name: Panomix
repo_url: https://github.com/panomix/panomix/
repo_name: panomix/panomix
strict: true
nav:
  - Korean:
      - Home: index.md
      - Flagship - ADK : flagship/adk.md
      - 클라이언트 프로젝트 Client Cases:
          - 스웬 Swen: clients/news/swen.md
          - 소셜봇 SocialBot: clients/socialbot/socialbot.md
          - 뉴스챗 NewsChat: clients/newschat/newschat.md
          - 반도체 Semiconductor AI Project: clients/factory/factory.md

      - 파트너십 Partnerships:
          - TikTok Marketing Partner: partners/tiktok/overview.md
          - Botpress Certified Partner: partners/botpress/overview.md

      - Our Framework: consulting/framework.md

  - English:
      - Home: en/index.md
      - Flagship - ADK : en/flagship/adk.md
      - Client Cases:
          - Swen: en/clients/news/swen.md
          - SocialBot: en/clients/socialbot/socialbot.md
          - NewsChat: en/clients/newschat/newschat.md
          - Semiconductor AI Project: en/clients/factory/factory.md

      - Partnerships:
          - TikTok Marketing Partner: en/partners/tiktok/overview.md
          - Botpress Certified Partner: en/partners/botpress/overview.md

      - Our Framework: en/consulting/framework.md

theme:
  name: material
  custom_dir: docs/theme
  logo: assets/whitelogo.png
  favicon: assets/favicon.ico
  font:
    text: Inter

  palette:
      scheme: mesop-dark
      toggle:
        icon: material/brightness-7
        name: Switch to light mode 

  features:
    - content.code.copy
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.prune
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - search.highlight
  language: en  # default UI language (search, etc.)

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - md_in_html

plugins:
  - blog
  - search
  - mkdocstrings:
      default_handler: python

      handlers:
        python:
          options:
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: spacy
            heading_level: 3
            inherited_members: true
            merge_init_into_class: true
            separate_signature: false
            show_signature: false
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
